name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: test with the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout 20m ./...

      - name: test
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 20m ./...

      - name: build binaries
        run: go build ./cmd/...

      - name: build the in-browser cluster (WebAssembly)
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go vet ./cmd/kvwasm && GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/kvwasm

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t raftkv .
