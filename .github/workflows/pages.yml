# Publishes the live demo to GitHub Pages: the cluster compiled to WebAssembly
# (cmd/kvwasm) plus the dashboard from cmd/kvdemo, switched to in-browser mode.
name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build the site
        run: |
          mkdir -p site
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o site/raftkv.wasm ./cmd/kvwasm
          # wasm_exec.js must come from the same Go version that built the .wasm.
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/ 2>/dev/null || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" site/
          sed 's/<meta name="raftkv-mode" content="server">/<meta name="raftkv-mode" content="wasm">/' cmd/kvdemo/index.html > site/index.html
          grep -q '<meta name="raftkv-mode" content="wasm">' site/index.html
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
