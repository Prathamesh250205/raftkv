# A 3-node, 3-shard cluster with Prometheus and Grafana.
#   docker compose up -d --build
#   open http://localhost:3000   (Grafana dashboard "raftkv")
#   ./scripts/chaos.sh           (break things while a client writes)
#
# Nodes find each other by service name, so clients that follow redirects
# should run inside the compose network, e.g.:
#   docker compose run --rm client -addr node1:8000 -duration 10s

x-node: &node
  build: .
  image: raftkv
  restart: unless-stopped

services:
  node1:
    <<: *node
    command: [-id, "1", -addr, "node1:8000", -listen, "0.0.0.0:8000", -shards, "3",
              -cluster, "1=node1:8000,2=node2:8000,3=node3:8000", -data, /data]
    volumes: [node1:/data]
    ports: ["8001:8000"]
  node2:
    <<: *node
    command: [-id, "2", -addr, "node2:8000", -listen, "0.0.0.0:8000", -shards, "3",
              -cluster, "1=node1:8000,2=node2:8000,3=node3:8000", -data, /data]
    volumes: [node2:/data]
    ports: ["8002:8000"]
  node3:
    <<: *node
    command: [-id, "3", -addr, "node3:8000", -listen, "0.0.0.0:8000", -shards, "3",
              -cluster, "1=node1:8000,2=node2:8000,3=node3:8000", -data, /data]
    volumes: [node3:/data]
    ports: ["8003:8000"]

  # Load generator; run on demand: docker compose run --rm client -addr node1:8000
  client:
    image: raftkv
    entrypoint: [kvbench]
    profiles: [tools]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  # Anonymous visitors can view dashboards but change nothing. Sign in as
  # admin with GRAFANA_ADMIN_PASSWORD (default "admin" for local use only).
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/raftkv.json
    volumes:
      - "./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3000:3000"]

volumes:
  node1:
  node2:
  node3:
